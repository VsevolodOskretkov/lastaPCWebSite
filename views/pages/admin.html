<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Админ панель</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0"></script>
  
  <style>
    /* Стиль для фото без урезания */
    .product-image {
      width: 100%;
      aspect-ratio: 655 / 763;
      object-fit: contain;
      background: #1a1b1f;
      border-radius: 12px;
    }
    
    /* Уменьшенные карточки */
    .product-card {
      max-width: 280px;
      margin: 0 auto;
      transition: all 0.3s ease;
    }
    
    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 32px rgba(139, 92, 246, 0.1);
    }
    
    @media (max-width: 640px) {
      .product-card {
        max-width: 100%;
      }
    }

    /* Стили для скролла заказов */
    .orders-container {
      max-height: 600px;
      overflow-y: auto;
    }
    
    .orders-container::-webkit-scrollbar {
      width: 6px;
    }
    
    .orders-container::-webkit-scrollbar-track {
      background: #1a1b1f;
      border-radius: 3px;
    }
    
    .orders-container::-webkit-scrollbar-thumb {
      background: #4a4a4a;
      border-radius: 3px;
    }
    
    .orders-container::-webkit-scrollbar-thumb:hover {
      background: #6a6a6a;
    }

    /* Статусы заказов */
    .status-pending { background: #fbbf24; color: #000; }
    .status-processing { background: #60a5fa; color: #000; }
    .status-shipped { background: #a78bfa; color: #000; }
    .status-delivered { background: #34d399; color: #000; }
    .status-cancelled { background: #f87171; color: #000; }
  </style>
</head>

<body class="bg-black text-white p-4 md:p-10">

<h1 class="text-3xl mb-8">Админ панель</h1>

<!-- ДВЕ КОЛОНКИ: ФОРМА + СПИСОК ТОВАРОВ -->
<div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

  <!-- ЛЕВАЯ КОЛОНКА - ФОРМА (1/3) -->
  <div class="lg:col-span-1">
    <form id="createComputerForm" class="space-y-4">
      <h2 class="text-xl font-semibold text-purple-400 mb-4">➕ Создать/Редактировать ПК</h2>

      <input id="title"
             placeholder="Название"
             class="w-full p-3 bg-gray-900 rounded border border-gray-800 focus:border-purple-500 outline-none"
             required>

      <input id="slug"
             placeholder="Slug (например: sputnik)"
             class="w-full p-3 bg-gray-900 rounded border border-gray-800 focus:border-purple-500 outline-none">
      <p class="text-gray-500 text-xs -mt-2">Уникальный идентификатор для URL</p>

      <select id="category"
              class="w-full p-3 bg-gray-900 rounded border border-gray-800 focus:border-purple-500 outline-none"
              required>
        <option value="silver">Silver</option>
        <option value="gold">Gold</option>
        <option value="platina">Platina</option>
      </select>

      <textarea id="description"
                placeholder="Описание"
                class="w-full bg-gray-900 p-3 rounded border border-gray-800 focus:border-purple-500 outline-none"
                rows="3"></textarea>

      <input id="short_description"
             placeholder="Краткое описание"
             class="w-full p-3 bg-gray-900 rounded border border-gray-800 focus:border-purple-500 outline-none">

      <input id="price"
             type="number"
             placeholder="Цена"
             class="w-full p-3 bg-gray-900 rounded border border-gray-800 focus:border-purple-500 outline-none"
             required>

      <input id="cpu"
             placeholder="Процессор"
             class="w-full p-3 bg-gray-900 rounded border border-gray-800 focus:border-purple-500 outline-none"
             required>

      <input id="gpu"
             placeholder="Видеокарта"
             class="w-full p-3 bg-gray-900 rounded border border-gray-800 focus:border-purple-500 outline-none"
             required>

      <input id="ram"
             placeholder="Оперативная память"
             class="w-full p-3 bg-gray-900 rounded border border-gray-800 focus:border-purple-500 outline-none"
             required>

      <input id="storage"
             placeholder="SSD/HDD"
             class="w-full p-3 bg-gray-900 rounded border border-gray-800 focus:border-purple-500 outline-none"
             required>

      <input id="image"
             placeholder="Ссылка на изображение"
             class="w-full p-3 bg-gray-900 rounded border border-gray-800 focus:border-purple-500 outline-none"
             required>

      <input id="windows"
             placeholder="Версия Windows"
             class="w-full p-3 bg-gray-900 rounded border border-gray-800 focus:border-purple-500 outline-none"
             value="Windows 11">

      <textarea id="features"
                placeholder="Преимущества (каждое с новой строки)"
                class="w-full bg-gray-900 p-3 rounded border border-gray-800 focus:border-purple-500 outline-none"
                rows="3"></textarea>
      <p class="text-gray-500 text-xs -mt-2">Каждое преимущество пишите с новой строки</p>

      <textarea id="fps"
                placeholder="FPS в играх (формат: CS2: 200 FPS, Valorant: 300 FPS)"
                class="w-full bg-gray-900 p-3 rounded border border-gray-800 focus:border-purple-500 outline-none"
                rows="2"></textarea>
      <p class="text-gray-500 text-xs -mt-2">Пример: CS2: 200 FPS, Valorant: 300 FPS</p>

      <div class="flex items-center gap-4">
        <input type="checkbox" id="published" class="w-5 h-5" checked>
        <label for="published" class="text-gray-300">Опубликовано</label>
      </div>

      <button class="bg-purple-600 px-6 py-3 rounded hover:bg-purple-700 transition w-full">
        ✨ Создать компьютер
      </button>
    </form>
  </div>

  <!-- ПРАВАЯ КОЛОНКА - СПИСОК ТОВАРОВ (2/3) -->
  <div class="lg:col-span-2">
    <h2 class="text-xl font-semibold text-purple-400 mb-4">Список компьютеров</h2>
    <div id="computersList" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4">
      <!-- Загружается через JS -->
    </div>
  </div>

</div>

<!-- ЗАКАЗЫ -->
<div class="mt-12">
  <h2 class="text-2xl font-semibold text-purple-400 mb-6">Заказы</h2>
  
  <div id="ordersList" class="orders-container bg-gray-900/50 rounded-xl p-4 border border-gray-800">
    <div class="text-center text-gray-400 py-8">
      <div class="spinner mx-auto mb-2"></div>
      Загрузка заказов...
    </div>
  </div>
</div>

<script src="/scripts/supabase.js"></script>
<script src="/scripts/admin.js"></script>

</body>
</html>

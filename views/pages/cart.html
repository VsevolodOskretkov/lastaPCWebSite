<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Корзина | LASTA.PC</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0"></script>

  <style>
    @font-face {
      font-family: 'Tektur Regular';
      src: url('/src/Fonts/Tektur-Regular.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    
    @font-face {
      font-family: 'Tektur Bold';
      src: url('/src/Fonts/Tektur-Bold.ttf') format('truetype');
      font-weight: bold;
      font-style: normal;
      font-display: swap;
    }
    
    body {
      font-family: 'Tektur Regular', monospace, sans-serif;
      background: #1a1a1a;
      color: #ffffff;
      overflow-x: hidden;
    }
    
    h1, h2, h3, h4, .font-bold, button, nav a, .tracking-widest {
      font-family: 'Tektur Bold', monospace, sans-serif;
      color: #ffffff !important;
    }
    
    .text-xl, .text-5xl, .text-2xl, .text-lg {
      font-family: 'Tektur Bold', monospace, sans-serif;
      color: #ffffff !important;
    }
    
    /* Стили для карточек товаров */
    .cart-item {
      background: #2a2a2a;
      border: 1px solid #3a3a3a;
      border-radius: 16px;
      padding: 20px;
      transition: all 0.3s ease;
    }

    .cart-item:hover {
      border-color: #4a4a4a;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .cart-item * {
      color: #ffffff !important;
    }

    /* Кнопки количества */
    .qty-btn {
      background: #3a3a3a;
      color: #ffffff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 18px;
      min-width: 40px;
    }

    .qty-btn:hover {
      background: #4a4a4a;
    }

    .qty-btn:active {
      transform: scale(0.95);
    }

    /* Кнопка удаления */
    .remove-btn {
      background: #dc2626;
      color: #ffffff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 14px;
    }

    .remove-btn:hover {
      background: #b91c1c;
    }

    /* Кнопка оформления */
    .checkout-btn {
      background: #7c3aed;
      color: #ffffff;
      border: none;
      padding: 16px 40px;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 20px;
      font-weight: bold;
    }

    .checkout-btn:hover {
      background: #6d28d9;
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(124, 58, 237, 0.3);
    }

    .checkout-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* Спецификации товара */
    .spec-item {
      background: #333333;
      padding: 12px;
      border-radius: 12px;
    }

    .spec-item .label {
      color: #9ca3af !important;
      font-size: 11px;
      margin-bottom: 4px;
    }

    .spec-item .value {
      color: #ffffff !important;
      font-size: 13px;
    }

    /* Адаптивность */
    @media (max-width: 768px) {
      .cart-item {
        padding: 16px;
      }
      
      .spec-item {
        padding: 8px;
      }
      
      .spec-item .value {
        font-size: 11px;
      }
    }

    /* Стили для пустой корзины */
    .empty-cart-icon {
      font-size: 64px;
      margin-bottom: 16px;
    }

    /* Анимация загрузки */
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255,255,255,0.1);
      border-top-color: #7c3aed;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    /* Стили для header */
    header {
      background: rgba(26, 26, 26, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #333333;
    }

    header * {
      color: #ffffff !important;
    }

    /* Стили для footer */
    footer {
      border-top: 1px solid #333333;
      background: #1a1a1a;
    }

    footer * {
      color: #9ca3af !important;
    }

    footer .text-white {
      color: #ffffff !important;
    }

    /* Стили для ссылок */
    a {
      color: #a78bfa !important;
      transition: color 0.2s ease;
    }

    a:hover {
      color: #c4b5fd !important;
    }

    /* Scrollbar стилизация */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #2a2a2a;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb {
      background: #4a4a4a;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #5a5a5a;
    }
  </style>
</head>

<body>

<!-- HEADER -->
<header class="flex items-center justify-between px-4 md:px-12 py-3 sticky top-0 z-50">
  <a href="/" class="text-xl md:text-2xl font-bold tracking-widest">LASTA.PC</a>

  <nav class="hidden md:flex gap-8 text-sm text-gray-300">
    <a href="/catalog" class="hover:text-white transition">Готовые решения</a>
    <a href="/configuration" class="hover:text-white transition">Конструктор</a>
    <a href="/faq" class="hover:text-white transition">Вопросы</a>
  </nav>

  <!-- Мобильное меню -->
  <button id="mobileMenuBtn" class="md:hidden text-gray-300 hover:text-white transition" aria-label="Меню">
    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
    </svg>
  </button>

  <!-- Мобильное меню (выпадающее) -->
  <div id="mobileMenu" class="hidden md:hidden absolute top-16 left-0 right-0 bg-[#1a1a1a] border-b border-gray-800 z-50">
    <div class="flex flex-col p-4 gap-3">
      <a href="/catalog" class="text-gray-300 hover:text-white transition py-2 px-4 hover:bg-gray-800 rounded-lg">Готовые решения</a>
      <a href="/configuration" class="text-gray-300 hover:text-white transition py-2 px-4 hover:bg-gray-800 rounded-lg">Конструктор</a>
      <a href="/faq" class="text-gray-300 hover:text-white transition py-2 px-4 hover:bg-gray-800 rounded-lg">Вопросы</a>
    </div>
  </div>

  <div class="flex gap-2 md:gap-4 items-center">
    <span class="cursor-pointer hover:text-purple-500 transition" onclick="window.location.href='/profile'">
      <img src="/src/img/svg/user.svg" alt="Профиль" class="w-9 h-9 md:w-11 md:h-11">
    </span>
    <a href="/cart" class="cursor-pointer hover:text-purple-500 transition block"> 
      <img src="/src/img/svg/shopping-cart.svg" alt="Корзина" class="w-9 h-9 md:w-11 md:h-11"> 
    </a>
  </div>
</header>

<!-- ОСНОВНОЙ КОНТЕНТ -->
<div class="max-w-7xl mx-auto px-4 sm:px-6 md:px-8 py-8 sm:py-12 md:py-20">
  <h1 class="text-3xl sm:text-4xl md:text-5xl mb-6 sm:mb-8 md:mb-12">
    🛒 Корзина
  </h1>

  <div id="cartContainer" class="space-y-4 sm:space-y-6">
    <!-- Контент загружается через JavaScript -->
  </div>
</div>

<!-- FOOTER -->
<footer class="border-t border-gray-800 text-gray-400 text-sm mt-12">
  <div class="max-w-[1400px] mx-auto px-4 md:px-6 py-8 md:py-10 flex flex-col md:flex-row justify-between gap-6 md:gap-8">
    <!-- LEFT -->
    <div class="space-y-2 text-center md:text-left">
      <div class="text-white tracking-widest text-[13px] mb-3">
        LASTA.PC
      </div>
      <p>+7 (923) 428-44-54</p>
      <p>lasta@gmail.com</p>
      <p>г. Санкт-Петербург, ул. Коллонтай 21к1</p>
    </div>

    <!-- RIGHT -->
    <div class="flex flex-col items-center md:items-end gap-4">
      <!-- SOCIALS -->
      <div class="flex gap-4 text-lg">
        <a href="https://vk.ru/oskretkov1" class="hover:opacity-80 transition" aria-label="VK">
          <img src="/src/img/svg/vk.svg" alt="VK" class="w-6 h-6">
        </a>
        <a href="https://t.me/kain3131" class="hover:opacity-80 transition" aria-label="Telegram">
          <img src="/src/img/svg/tg.svg" alt="Telegram" class="w-6 h-6">
        </a>
      </div>

      <!-- LINKS -->
      <div class="flex flex-col md:items-end gap-2 text-xs text-center md:text-right">
        <a href="#" class="hover:text-white transition">Реквизиты</a>
        <a href="#" class="hover:text-white transition">Политика конфиденциальности</a>
        <a href="#" class="hover:text-white transition">Пользовательское соглашение</a>
      </div>
    </div>
  </div>
</footer>

<script src="/scripts/supabase.js"></script>
<script src="/scripts/cart.js"></script>

<script>
// Мобильное меню
document.getElementById('mobileMenuBtn')?.addEventListener('click', function() {
  const menu = document.getElementById('mobileMenu');
  menu.classList.toggle('hidden');
});

document.querySelectorAll('#mobileMenu a').forEach(link => {
  link.addEventListener('click', function() {
    document.getElementById('mobileMenu').classList.add('hidden');
  });
});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Конструктор ПК | LASTA.PC</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0"></script>

  <style>
    @font-face {
      font-family: 'Tektur Regular';
      src: url('/src/Fonts/Tektur-Regular.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    
    @font-face {
      font-family: 'Tektur Bold';
      src: url('/src/Fonts/Tektur-Bold.ttf') format('truetype');
      font-weight: bold;
      font-style: normal;
      font-display: swap;
    }
    
    body {
      font-family: 'Tektur Regular', monospace, sans-serif;
      overflow-x: hidden;
    }
    
    h1, h2, h3, h4, .font-bold, button, nav a, .tracking-widest {
      font-family: 'Tektur Bold', monospace, sans-serif;
    }
    
    .text-xl, .text-5xl, .text-2xl, .text-lg {
      font-family: 'Tektur Bold', monospace, sans-serif;
    }
    
    @layer base {
      html {
        scroll-behavior: smooth;
      }
    }
    
    .left-column {
      width: 100%;
      min-width: 0;
    }
    
    .component-container {
      position: relative;
    }
    
    .component-dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      z-index: 50;
      background-color: #18191d;
      border: 1px solid #374151;
      border-radius: 1rem;
      margin-top: 0.5rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
      max-height: 400px;
      overflow-y: auto;
    }
    
    .component-dropdown::-webkit-scrollbar {
      width: 8px;
    }
    
    .component-dropdown::-webkit-scrollbar-track {
      background: #2d2d2d;
      border-radius: 4px;
    }
    
    .component-dropdown::-webkit-scrollbar-thumb {
      background: #7c3aed;
      border-radius: 4px;
    }
    
    .component-dropdown:not(.hidden) {
      animation: fadeInDown 0.2s ease-out;
    }
    
    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    body.no-scroll {
      overflow: hidden;
    }
    
    .component-container button svg {
      transition: transform 0.2s ease;
    }
    
    #summaryCpu, #summaryGpu, #summaryRam, 
    #summaryMotherboard, #summaryCooler, 
    #summaryStorage, #summaryPsu, #summaryCase {
      color: #d1d5db;
      font-size: 0.875rem;
      line-height: 1.4;
    }

    /* Улучшение кликабельности на мобильных */
    button, a {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    /* Адаптивные настройки */
    @media (max-width: 640px) {
      .config-title {
        font-size: 1.25rem;
      }
      .config-total {
        font-size: 1.5rem;
      }
      .component-btn {
        padding: 0.75rem 1rem;
        font-size: 0.875rem;
      }
    }

    @media (max-width: 1024px) {
      .main-padding {
        padding-left: 1rem;
        padding-right: 1rem;
        padding-top: 1rem;
        padding-bottom: 1rem;
      }
    }

    /* Стили для центрирования */
    .config-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    @media (min-width: 1024px) {
      .config-grid {
        grid-template-columns: 1fr 400px;
        gap: 3rem;
        align-items: start;
      }
    }

    @media (min-width: 1280px) {
      .config-grid {
        grid-template-columns: 1fr 420px;
        gap: 3.5rem;
      }
    }

    .component-card {
      background: #18191d;
      border: 1px solid #2a2b30;
      border-radius: 1.25rem;
      padding: 1rem;
      transition: all 0.3s ease;
    }

    .component-card:hover {
      border-color: #3a3b40;
    }

    .config-panel {
      background: #18191d;
      border: 1px solid #2a2b30;
      border-radius: 1.5rem;
      padding: 1.5rem;
      position: sticky;
      top: 1rem;
    }

    @media (max-width: 1024px) {
      .config-panel {
        position: static;
      }
    }

    /* Кнопка "Добавить в корзину" - только border */
    .btn-add-to-cart {
      width: 100%;
      padding: 0.75rem 1.5rem;
      background: transparent;
      border: 2px solid #7c3aed;
      color: #a78bfa;
      border-radius: 0.75rem;
      font-size: 0.9rem;
      font-weight: bold;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .btn-add-to-cart:hover {
      background: #7c3aed;
      color: #ffffff;
      border-color: #7c3aed;
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(124, 58, 237, 0.2);
    }

    .btn-add-to-cart:active {
      transform: scale(0.97);
    }
  </style>
</head>

<body class="bg-gray-950 text-white font-sans overflow-x-hidden">

<!-- HEADER -->
<header class="flex items-center justify-between px-4 md:px-12 py-2 md:py-3 border-b border-gray-800 bg-gray-950/90 backdrop-blur-sm sticky top-0 z-50">
  <a href="/" class="text-xl md:text-2xl font-bold tracking-widest">LASTA.PC</a>

  <nav class="hidden md:flex gap-8 text-sm text-gray-300">
    <a href="/catalog" class="hover:text-white transition">Готовые решения</a>
    <a href="/configuration" class="hover:text-white transition">Конструктор</a>
    <a href="/faq" class="hover:text-white transition">Вопросы</a>
  </nav>

  <!-- Мобильное меню (бургер) -->
  <button id="mobileMenuBtn" class="md:hidden text-gray-300 hover:text-white transition" aria-label="Меню">
    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
    </svg>
  </button>

  <!-- Мобильное меню (выпадающее) -->
  <div id="mobileMenu" class="hidden md:hidden absolute top-14 md:top-16 left-0 right-0 bg-gray-900 border-b border-gray-800 z-50">
    <div class="flex flex-col p-4 gap-3">
      <a href="/catalog" class="text-gray-300 hover:text-white transition py-2 px-4 hover:bg-gray-800 rounded-lg">Готовые решения</a>
      <a href="/configuration" class="text-gray-300 hover:text-white transition py-2 px-4 hover:bg-gray-800 rounded-lg">Конструктор</a>
      <a href="/faq" class="text-gray-300 hover:text-white transition py-2 px-4 hover:bg-gray-800 rounded-lg">Вопросы</a>
    </div>
  </div>

  <div class="flex gap-2 md:gap-4 items-center">
    <span class="cursor-pointer hover:text-purple-500 transition" onclick="window.location.href='/profile'">
      <img src="/src/img/svg/user.svg" alt="Профиль" class="w-9 h-9 md:w-11 md:h-11">
    </span>
    <a href="/cart" class="cursor-pointer hover:text-purple-500 transition block"> 
      <img src="/src/img/svg/shopping-cart.svg" alt="Корзина" class="w-9 h-9 md:w-11 md:h-11"> 
    </a>
  </div>
</header>

<!-- MAIN -->
<section class="max-w-[1400px] mx-auto px-4 sm:px-6 md:px-8 lg:px-12 xl:px-20 py-6 sm:py-8 md:py-10 lg:py-12">
  
  <h1 class="text-2xl sm:text-3xl md:text-4xl font-bold mb-6 sm:mb-8 md:mb-10 text-center">Конструктор ПК</h1>

  <div class="config-grid">
    <!-- LEFT - Компоненты -->
    <div class="space-y-3 sm:space-y-4">
      <div id="cpuContainer" class="component-container"></div>
      <div id="gpuContainer" class="component-container"></div>
      <div id="ramContainer" class="component-container"></div>
      <div id="motherboardContainer" class="component-container"></div>
      <div id="coolerContainer" class="component-container"></div>
      <div id="storageContainer" class="component-container"></div>
      <div id="psuContainer" class="component-container"></div>
      <div id="caseContainer" class="component-container"></div>
    </div>

    <!-- RIGHT - Панель конфигурации -->
    <div class="config-panel">
      <h2 class="text-xl sm:text-2xl mb-4 font-bold config-title">Конфигурация</h2>
      
      <div class="mb-4">
        <label class="block text-sm text-gray-400 mb-1.5">Название сборки *</label>
        <input 
          type="text" 
          id="buildName" 
          placeholder="Игровой монстр 2026" 
          class="w-full bg-[#23242a] border border-gray-700 rounded-xl px-3 sm:px-4 py-2.5 text-sm text-white placeholder-gray-500 focus:border-purple-500 focus:outline-none transition"
          maxlength="50">
        <p id="buildNameError" class="text-red-400 text-xs mt-1 hidden">Введите название сборки</p>
      </div>
      
      <div class="grid grid-cols-2 gap-x-4 gap-y-2.5 text-sm border-b border-gray-800 pb-4 mb-4">
        <div class="flex flex-col">
          <span class="text-gray-400 text-[10px] uppercase tracking-wider mb-0.5">CPU</span>
          <span id="summaryCpu" class="truncate font-semibold text-sm">-</span>
        </div>
        <div class="flex flex-col">
          <span class="text-gray-400 text-[10px] uppercase tracking-wider mb-0.5">GPU</span>
          <span id="summaryGpu" class="truncate font-semibold text-sm">-</span>
        </div>
        <div class="flex flex-col">
          <span class="text-gray-400 text-[10px] uppercase tracking-wider mb-0.5">RAM</span>
          <span id="summaryRam" class="truncate font-semibold text-sm">-</span>
        </div>
        <div class="flex flex-col">
          <span class="text-gray-400 text-[10px] uppercase tracking-wider mb-0.5">Мат. плата</span>
          <span id="summaryMotherboard" class="truncate font-semibold text-sm">-</span>
        </div>
        <div class="flex flex-col">
          <span class="text-gray-400 text-[10px] uppercase tracking-wider mb-0.5">Охлаждение</span>
          <span id="summaryCooler" class="truncate font-semibold text-sm">-</span>
        </div>
        <div class="flex flex-col">
          <span class="text-gray-400 text-[10px] uppercase tracking-wider mb-0.5">Накопитель</span>
          <span id="summaryStorage" class="truncate font-semibold text-sm">-</span>
        </div>
        <div class="flex flex-col">
          <span class="text-gray-400 text-[10px] uppercase tracking-wider mb-0.5">Блок питания</span>
          <span id="summaryPsu" class="truncate font-semibold text-sm">-</span>
        </div>
        <div class="flex flex-col">
          <span class="text-gray-400 text-[10px] uppercase tracking-wider mb-0.5">Корпус</span>
          <span id="summaryCase" class="truncate font-semibold text-sm">-</span>
        </div>
      </div>

      <div class="flex justify-between items-center mb-4">
        <span class="text-base font-bold">Итого</span>
        <span id="totalPrice" class="text-2xl text-purple-400 font-bold config-total">0 ₽</span>
      </div>

      <button onclick="addToCart()" class="btn-add-to-cart">
        Добавить в корзину
      </button>
      
      <p class="text-gray-500 text-xs text-center mt-3">Все поля обязательны для заполнения</p>
    </div>
  </div>
</section>

<script src="/scripts/supabase.js"></script>
<script src="/scripts/configurator.js"></script>

<script>
// Мобильное меню
document.getElementById('mobileMenuBtn')?.addEventListener('click', function() {
  const menu = document.getElementById('mobileMenu');
  menu.classList.toggle('hidden');
});

document.querySelectorAll('#mobileMenu a').forEach(link => {
  link.addEventListener('click', function() {
    document.getElementById('mobileMenu').classList.add('hidden');
  });
});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Авторизация | LASTA.PC</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0"></script>
  
  <style>
    @font-face {
      font-family: 'Tektur Regular';
      src: url('/src/Fonts/Tektur-Regular.ttf') format('truetype');
    }

    @font-face {
      font-family: 'Tektur Bold';
      src: url('/src/Fonts/Tektur-Bold.ttf') format('truetype');
      font-weight: bold;
    }

    body {
      font-family: 'Tektur Regular', monospace, sans-serif;
    }

    h1, h2, h3, h4, .font-bold, button, nav a, .tracking-widest {
      font-family: 'Tektur Bold', monospace, sans-serif;
    }

    /* Улучшение кликабельности на мобильных */
    button, input {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    /* Адаптивные настройки */
    @media (max-width: 480px) {
      .auth-card {
        margin: 0.5rem;
        padding: 1.25rem;
        border-radius: 1rem;
      }
      .auth-title {
        font-size: 1.1rem;
      }
      .auth-subtitle {
        font-size: 0.65rem;
      }
      .auth-input {
        padding: 0.75rem;
        font-size: 0.9rem;
      }
      .auth-btn {
        padding: 0.75rem;
        font-size: 0.9rem;
      }
      .tab-btn {
        padding: 0.5rem;
        font-size: 0.8rem;
      }
    }

    @media (min-width: 481px) and (max-width: 768px) {
      .auth-card {
        padding: 1.5rem;
      }
    }
  </style>
</head>

<body class="bg-[#0f0f10] text-white flex items-center justify-center min-h-screen p-3 sm:p-4">

<div class="w-full max-w-md bg-[#1a1b1f] rounded-2xl sm:rounded-3xl p-5 sm:p-8 border border-black/40 auth-card">

  <div class="text-center mb-5 sm:mb-8">
    <div class="text-[10px] sm:text-sm tracking-widest text-gray-400 mb-1 sm:mb-2 auth-subtitle">LASTA.PC</div>
    <h1 class="text-lg sm:text-xl auth-title">Личный кабинет</h1>
  </div>

  <!-- TABS -->
  <div class="flex mb-4 sm:mb-6 bg-[#23242a] rounded-lg p-1 text-xs sm:text-sm">
    <button type="button" id="loginTab" class="w-1/2 py-2 sm:py-2.5 rounded-md bg-purple-600 tab-btn">
      Вход
    </button>
    <button type="button" id="registerTab" class="w-1/2 py-2 sm:py-2.5 rounded-md text-gray-400 tab-btn">
      Регистрация
    </button>
  </div>

  <!-- LOGIN -->
  <form id="loginForm" class="space-y-3 sm:space-y-4">
    <input id="loginEmail" 
           type="email" 
           placeholder="Email" 
           class="w-full bg-[#23242a] p-3 sm:p-3.5 rounded-lg text-sm sm:text-base auth-input"
           required>
    <input id="loginPassword" 
           type="password" 
           placeholder="Пароль" 
           class="w-full bg-[#23242a] p-3 sm:p-3.5 rounded-lg text-sm sm:text-base auth-input"
           required>
    <button type="submit" 
            class="w-full bg-purple-600 hover:bg-purple-700 py-3 sm:py-3.5 rounded-lg text-sm sm:text-base transition auth-btn">
      Войти
    </button>
  </form>

  <!-- REGISTER -->
  <form id="registerForm" class="space-y-3 sm:space-y-4 hidden">
    <input id="regName" 
           type="text" 
           placeholder="Имя" 
           class="w-full bg-[#23242a] p-3 sm:p-3.5 rounded-lg text-sm sm:text-base auth-input"
           required>
    <input id="regEmail" 
           type="email" 
           placeholder="Email" 
           class="w-full bg-[#23242a] p-3 sm:p-3.5 rounded-lg text-sm sm:text-base auth-input"
           required>
    <input id="regPassword" 
           type="password" 
           placeholder="Пароль" 
           class="w-full bg-[#23242a] p-3 sm:p-3.5 rounded-lg text-sm sm:text-base auth-input"
           required>
    <input id="regPassword2" 
           type="password" 
           placeholder="Повторите пароль" 
           class="w-full bg-[#23242a] p-3 sm:p-3.5 rounded-lg text-sm sm:text-base auth-input"
           required>
    <button type="submit" 
            class="w-full bg-purple-600 hover:bg-purple-700 py-3 sm:py-3.5 rounded-lg text-sm sm:text-base transition auth-btn">
      Зарегистрироваться
    </button>
  </form>

</div>

<script src="/scripts/supabase.js"></script>
<script>
// Скрипт остается без изменений
const loginTab = document.getElementById('loginTab');
const registerTab = document.getElementById('registerTab');
const loginForm = document.getElementById('loginForm');
const registerForm = document.getElementById('registerForm');

loginTab.addEventListener('click', () => {
  loginTab.className = 'w-1/2 py-2 rounded-md bg-purple-600';
  registerTab.className = 'w-1/2 py-2 rounded-md text-gray-400';
  loginForm.classList.remove('hidden');
  registerForm.classList.add('hidden');
});

registerTab.addEventListener('click', () => {
  registerTab.className = 'w-1/2 py-2 rounded-md bg-purple-600';
  loginTab.className = 'w-1/2 py-2 rounded-md text-gray-400';
  registerForm.classList.remove('hidden');
  loginForm.classList.add('hidden');
});

loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPassword').value;
  const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if (error) {
    alert('Ошибка: ' + error.message);
  } else {
    window.location.href = '/profile';
  }
});

registerForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = document.getElementById('regName').value;
  const email = document.getElementById('regEmail').value;
  const password = document.getElementById('regPassword').value;
  const password2 = document.getElementById('regPassword2').value;
  if (password !== password2) {
    alert('Пароли не совпадают');
    return;
  }
  const { error } = await supabaseClient.auth.signUp({
    email,
    password,
    options: { data: { full_name: name } }
  });
  if (error) {
    alert('Ошибка: ' + error.message);
  } else {
    alert('Регистрация успешна! Проверьте почту.');
  }
});
</script>

</body>
</html>
